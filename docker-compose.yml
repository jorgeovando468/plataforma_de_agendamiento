services:
  db:
    image: mysql:8.0
    container_name: consultorio-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "admin123"
      MYSQL_DATABASE: consultorio_psicologico
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - consultorio-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-padmin123"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build: ./Backend
    container_name: consultorio-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=admin123
      - DB_NAME=consultorio_psicologico
      - JWT_SECRET=tu_jwt_secret_aqui
      - EMAIL_USER=jorgeovando468@gmail.com
      - EMAIL_PASS=gigkjgghajslexcu
      - ENABLE_WHATSAPP=false
      - ENABLE_EMAIL=true
      - NODE_ENV=development
      - PORT=3000
    depends_on:
      db:
        condition: service_healthy
    command: npm run dev
    volumes:
      - ./Backend:/app
      - /app/node_modules
      - whatsapp_session:/app/.wwebjs_auth
    networks:
      - consultorio-network

  frontend:
    image: nginx:alpine
    container_name: consultorio-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./Frontend:/usr/share/nginx/html
      - ./Frontend/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - consultorio-network

volumes:
  db_data:
  whatsapp_session:

networks:
  consultorio-network:
    driver: bridge